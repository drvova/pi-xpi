<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="XPI — security tooling for the Pi agent. Runs on Pi, OMP, and PiG.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#140a2e"/>
      <stop offset="1" stop-color="#1b0b3a"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="296" rx="22" fill="url(#bg)" stroke="#2a2550" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="6" rx="3" fill="url(#edge)"/>

  <!-- shield + check mark motif -->
  <g transform="translate(96,150)">
    <path d="M0,-70 L62,-44 L62,10 C62,52 34,78 0,92 C-34,78 -62,52 -62,10 L-62,-44 Z"
          fill="none" stroke="url(#wm)" stroke-width="5" opacity="0.95"/>
    <path d="M-26,4 L-8,24 L30,-22" fill="none" stroke="#22d3ee" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="150" font-size="112" font-weight="800" fill="url(#wm)" letter-spacing="2">XPI</text>
  <text x="214" y="196" font-size="25" font-weight="600" fill="#c7d2fe">Security tooling for the Pi agent</text>
  <text x="214" y="228" font-size="17" fill="#8b93b8">casefile gates · proof-carrying attestations · exploit chains · coverage · code search</text>

  <!-- host chips -->
  <g font-size="18" font-weight="700">
    <g transform="translate(842,118)">
      <rect width="104" height="40" rx="20" fill="#1e1b3a" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="52" y="26" text-anchor="middle" fill="#ddd6fe">Pi</text>
    </g>
    <g transform="translate(958,118)">
      <rect width="104" height="40" rx="20" fill="#1e1b3a" stroke="#6366f1" stroke-width="1.5"/>
      <text x="52" y="26" text-anchor="middle" fill="#c7d2fe">OMP</text>
    </g>
    <g transform="translate(1074,118)">
      <rect width="104" height="40" rx="20" fill="#0f2230" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="52" y="26" text-anchor="middle" fill="#a5f3fc">PiG</text>
    </g>
  </g>
  <text x="894" y="196" font-size="14" fill="#6b7398">one codebase · three hosts</text>
</svg>
