<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="One shared host-agnostic core with a thin native entry per host: Pi, OMP, and PiG.">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#160a30"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6080"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h { font-weight: 800; }
      .s { font-weight: 600; }
      .m { fill: #8b93b8; }
      .c { fill: #6b7398; }
      .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="456" rx="22" fill="url(#hbg)" stroke="#2a2550" stroke-width="2"/>

  <!-- shared core -->
  <g transform="translate(360,36)">
    <rect width="480" height="96" rx="16" fill="#1a1636" stroke="url(#core)" stroke-width="2.5"/>
    <text x="240" y="40" text-anchor="middle" class="h" font-size="22" fill="#e9e6ff">Shared host-agnostic core</text>
    <text x="240" y="70" text-anchor="middle" class="code" font-size="15" fill="#a5b4fc">extension.ts · tools · ledger · PoC gates · XP workflow</text>
  </g>

  <!-- connectors -->
  <path d="M520,132 C520,176 250,176 250,210" fill="none" stroke="#5b6080" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,132 L600,210" fill="none" stroke="#5b6080" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680,132 C680,176 950,176 950,210" fill="none" stroke="#5b6080" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="186" text-anchor="middle" class="c" font-size="13">host primitives injected at the entry — no build pulls in another host's packages</text>

  <!-- Pi -->
  <g transform="translate(70,214)">
    <rect width="360" height="200" rx="16" fill="#171433" stroke="#8b5cf6" stroke-width="2"/>
    <text x="24" y="42" class="h" font-size="24" fill="#ddd6fe">Pi Agent</text>
    <text x="24" y="74" class="code s" font-size="14" fill="#c4b5fd">pi.extensions → *.ts</text>
    <text x="24" y="104" class="code" font-size="13.5" fill="#9aa3c7">imports @earendil-works/*</text>
    <line x1="24" y1="124" x2="336" y2="124" stroke="#2a2550"/>
    <text x="24" y="150" class="m" font-size="13.5">reads the pi manifest</text>
    <text x="24" y="174" class="m" font-size="13.5">swarm via pi-subagents · /xp lite solo</text>
  </g>

  <!-- OMP -->
  <g transform="translate(450,214)">
    <rect width="300" height="200" rx="16" fill="#151533" stroke="#6366f1" stroke-width="2"/>
    <text x="24" y="42" class="h" font-size="24" fill="#c7d2fe">OMP</text>
    <text x="24" y="74" class="code s" font-size="14" fill="#a5b4fc">omp.extensions → *.omp.ts</text>
    <text x="24" y="104" class="code" font-size="13.5" fill="#9aa3c7">imports @oh-my-pi/*</text>
    <line x1="24" y1="124" x2="276" y2="124" stroke="#2a2550"/>
    <text x="24" y="150" class="m" font-size="13.5">native settings schema</text>
    <text x="24" y="174" class="m" font-size="13.5">tool approval tiers · task tool</text>
  </g>

  <!-- PiG -->
  <g transform="translate(770,214)">
    <rect width="360" height="200" rx="16" fill="#0f2230" stroke="#22d3ee" stroke-width="2"/>
    <text x="24" y="42" class="h" font-size="24" fill="#a5f3fc">PiG — Pi-in-Go</text>
    <text x="24" y="74" class="code s" font-size="14" fill="#7dd3fc">runs the Pi entries unchanged</text>
    <text x="24" y="104" class="code" font-size="13.5" fill="#86a8bf">embedded Node runtime (Pi 1.3.0)</text>
    <line x1="24" y1="124" x2="336" y2="124" stroke="#123240"/>
    <text x="24" y="150" class="m" font-size="13.5">single Go binary · reads the pi manifest</text>
    <text x="24" y="174" class="m" font-size="13.5">verified: pig install --validate-only ✓</text>
  </g>
</svg>
